services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent-worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      intake-agent:
        condition: service_healthy
      coverage-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "worker"]
      interval: 10s
      timeout: 3s
      retries: 5

  intake-agent:
    build: .
    command: ["uvicorn", "app.agents.intake:app", "--host", "0.0.0.0", "--port", "8101"]
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  coverage-agent:
    build: .
    command: ["uvicorn", "app.agents.coverage:app", "--host", "0.0.0.0", "--port", "8102"]
    env_file: .env
    volumes:
      - corpus-index:/service/data/index
      - ./data/corpus/source:/service/data/corpus/source:ro
      - corpus-data:/service/data/corpus/processed
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  redis-data:
  corpus-index:
  corpus-data:
  grafana-data:
